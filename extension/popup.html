<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AI Follow Desk Capture</title>
<style>
  :root{color-scheme:light dark;--bg:light-dark(#FFFFFF,#1B181D);--fg:light-dark(#1F1314,#F3EEEE);--muted:light-dark(#5A5F6B,#ABA5AE);--line:light-dark(#E8DEDB,#322C36);--red:#DC2626;--ok:light-dark(#15803D,#6EDB95)}
  body{margin:0;width:320px;font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--fg)}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:16px}
  header p{margin:2px 0 0;color:var(--muted)}
  ul{list-style:none;margin:0;padding:6px 8px}
  li{display:flex;align-items:center;gap:10px;padding:8px}
  li b{flex:1;font-weight:600}
  li span{color:var(--muted);font-variant-numeric:tabular-nums}
  .sw{appearance:none;width:36px;height:22px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background-color .2s}
  .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:translate .2s}
  .sw:checked{background:var(--ok)}.sw:checked::after{translate:14px 0}
  .sw:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #1E40AF;outline-offset:2px}
  footer{display:grid;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
  .note{margin:0;color:var(--muted);font-size:12.5px}
  .row{display:flex;gap:8px}
  button,a.btn{flex:1;min-height:36px;border-radius:999px;border:1px solid var(--line);background:transparent;color:inherit;font:inherit;font-weight:600;cursor:pointer;text-align:center;text-decoration:none;display:grid;place-items:center}
  button.danger{color:var(--red)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><h1>AI Follow Desk Capture</h1><p id="summary">Loading…</p></header>
<ul id="list" aria-label="Capture by site"></ul>
<footer>
  <p class="note">Posts are saved only from accounts on your AI Follow Desk list, only from pages you open, and only in this browser.</p>
  <div class="row"><a class="btn" href="options.html" target="_blank">Connect app</a><button class="danger" id="clear">Clear saved posts</button></div>
</footer>
<script src="popup.js"></script>
</body>
</html>
